<script>
/* Perilaku header bersama: nama user, dropdown, Sign Out, pengaturan aksesibilitas */
(() => {
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch {} },
    del(k){ try { localStorage.removeItem(k); } catch {} }
  };
  const name = store.get('aequalis_user') || 'User';
  $('user-label').textContent = 'Halo, ' + name;
  $('who-name').textContent = name;
  $('avatar').textContent = name.charAt(0).toUpperCase();
  const btn = $('user-btn'), dd = $('dropdown');
  btn.addEventListener('click', e => { e.stopPropagation(); btn.setAttribute('aria-expanded', dd.classList.toggle('open')); });
  document.addEventListener('click', () => { dd.classList.remove('open'); btn.setAttribute('aria-expanded', false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') dd.classList.remove('open'); });
  $('logout').addEventListener('click', () => { store.del('aequalis_user'); location.href = 'aequalis-auth.html'; });

  let size = parseInt(store.get('aequalis_size') || '0', 10);
  const applySize = () => {
    ['t--1','t-1','t-2','t-3'].forEach(c => root.classList.remove(c));
    if (size) root.classList.add('t-' + size);
    store.set('aequalis_size', size);
  };
  document.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => {
    size = Math.max(-1, Math.min(3, size + parseInt(b.dataset.size, 10)));
    applySize();
  }));
  [['contrast','aequalis_contrast','t-contrast'], ['dys','aequalis_dys','t-dys']].forEach(([cls,key,id]) => {
    const apply = on => { root.classList.toggle(cls, on); $(id).setAttribute('aria-pressed', on); store.set(key, on ? '1':'0'); };
    $(id).addEventListener('click', () => apply(!root.classList.contains(cls)));
    apply(store.get(key) === '1');
  });
  applySize();
})();
</script>

    return {id:c.id+'-'+(i+1),cid:c.id,title:t,city:c.city,
      mode:i===0?c.mode:MODES[(MODES.indexOf(c.mode)+i)%3],
      type:i%3===2?'Paruh waktu':'Penuh waktu',min,max,days:i*3+1,
      deadline:d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear(),
      dis:c.dis.slice(0,Math.max(1,c.dis.length-(i%2))),acc:c.acc.map(a=>a[0])};
  });
});
const rp=n=>String(n).replace('.',',');
</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  /* ---------- Data lamaran (contoh + lamaran asli dari localStorage) ---------- */
  const STAGES = ['Terkirim','Dilihat','Wawancara','Penawaran'];
  const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const pad = n => String(n).padStart(2,'0');
  const fDate = d => `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
  const fTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const fShort = d => `${d.getDate()} ${BULAN[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const DOCS0 = [['CV_User_2026.pdf','124 KB'],['KTP.jpg','86 KB'],['Sertifikat_UIUX.pdf','212 KB']];
  const SEED = [
    { id:'a1', job:'teknologi-wicara-4',  sent:'2026-11-03T14:20', stage:3, interview:'2026-11-10T10:00', no:'ACJ-2026-0842', acc:['Interview via chat','Waktu tambahan'], approved:true,
      iv:{ platform:'Google Meet', link:'https://meet.google.com/abc-defg-hij', who:'Rina Kusuma', role:'HR Recruiter', dur:45 } },
    { id:'a2', job:'pelita-kreatif-1',    sent:'2026-11-04T10:05', stage:2, no:'ACJ-2026-0851', acc:[], approved:false },
    { id:'a3', job:'aksara-media-1',      sent:'2026-11-05T09:12', stage:2, no:'ACJ-2026-0866', acc:[], approved:false },
    { id:'a4', job:'visiona-finansial-1', sent:'2026-11-06T16:40', stage:1, no:'ACJ-2026-0879', acc:[], approved:false },
    { id:'a5', job:'kelor-negeri-1',      sent:'2026-11-06T18:02', stage:1, no:'ACJ-2026-0884', acc:[], approved:false }
  ].map(a => ({ ...a, docs: DOCS0 }));
  let stored = [];
  try { stored = JSON.parse(localStorage.getItem('aequalis_applications') || '[]'); } catch {}
  const real = stored.map((a, i) => ({ id:'r'+i, job:a.job, sent:a.date, stage:1, no:'ACJ-2026-'+(1000+i*37),
      acc: a.akomodasi ? [a.akomodasi] : [], approved:false, docs:Object.values(a.dokumen || {}).map(n => [n, '']) }))
    .filter(a => JOBS.some(j => j.id === a.job));
  const APPS = [...SEED, ...real].sort((a, b) => b.stage - a.stage || new Date(b.sent) - new Date(a.sent));
  const jobOf = a => JOBS.find(j => j.id === a.job);
  const coOf = a => COMPANIES.find(c => c.id === jobOf(a).cid);
  const bar = n => `<span class="seg">${[1,2,3,4].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;


  const id = new URLSearchParams(location.search).get('app');
  const a = APPS.find(x => x.id === id && x.interview) || APPS.find(x => x.interview);
  if (!a) {
    $('view').innerHTML = '<div class="card empty">Belum ada jadwal wawancara. Kami akan memberi tahu kamu begitu perusahaan menjadwalkannya.<br><br><a class="cta" style="display:inline-block" href="lamaran-saya.html">Kembali ke Lamaran Saya</a></div>';
    return;
  }
  const j = jobOf(a), c = coOf(a), iv = a.iv, start = new Date(a.interview), end = new Date(start.getTime() + iv.dur * 60000);
  document.title = 'Aequalis – Wawancara ' + j.title;
  $('back').href = 'detail-progres-lamaran.html?app=' + encodeURIComponent(a.id);

  const dot = d => `${pad(d.getHours())}.${pad(d.getMinutes())}`;
  const ACC_DESC = {
    'Interview via chat':'Kamu boleh menjawab lewat kolom chat kapan saja selama sesi.',
    'Waktu tambahan':'Durasi wawancara ditambah 15 menit dari jadwal normal.',
    'Juru bahasa isyarat':'Juru bahasa isyarat akan hadir di ruang rapat.'
  };
  const CHK_KEY = 'aequalis_checklist_' + a.id;
  const CHK = ['Cek koneksi internet & kamera 10 menit sebelum mulai','Siapkan portofolio (PDF atau link Behance/Dribbble)','Siapkan 2–3 pertanyaan untuk pewawancara'];
  let done = [true, true, false];
  try { const s = JSON.parse(localStorage.getItem(CHK_KEY)); if (Array.isArray(s) && s.length === CHK.length) done = s; } catch {}
  const shown = iv.link.replace(/^https?:\/\//, '');

  $('view').innerHTML = `
  <div class="layout">
    <section class="card main" aria-label="Rincian wawancara">
      <div class="top">
        <span class="ic" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></span>
        <div class="t"><h2>${esc(j.title)}</h2><p>${esc(c.name)} · ${esc(j.city)} · ${esc(j.mode)}</p></div>
        <span class="pill" id="status">● Terjadwal</span>
      </div>
      <div class="info">
        <div><span class="i" aria-hidden="true">🗓</span><span><small>Tanggal</small><b>${HARI[start.getDay()]}, ${start.getDate()} ${BULAN[start.getMonth()]} ${start.getFullYear()}</b></span></div>
        <div><span class="i" aria-hidden="true">🕒</span><span><small>Waktu</small><b>${dot(start)} – ${dot(end)} WIB</b></span></div>
        <div><span class="i" aria-hidden="true">🎥</span><span><small>Metode</small><b>Video call · ${esc(iv.platform)}</b></span></div>
        <div><span class="i" aria-hidden="true">👤</span><span><small>Pewawancara</small><b>${esc(iv.who)} · ${esc(iv.role)}</b></span></div>
      </div>
      <div class="link"><span aria-hidden="true">🔗</span><span id="link-txt">${esc(shown)}</span><button type="button" id="copy">Salin link</button></div>

      ${a.acc.length ? `<h3>Akomodasi yang disiapkan</h3>
      <ul class="acc">${a.acc.map(t => `<li><span class="i" aria-hidden="true">✓</span><div><b>${esc(t)}</b><span>${esc(ACC_DESC[t] || 'Disiapkan oleh perusahaan.')}</span></div></li>`).join('')}</ul>` : ''}

      <div class="chk-h"><h3>Checklist persiapan</h3><small id="chk-n" aria-live="polite"></small></div>
      <ul class="chk">${CHK.map((t, i) => `<li><label><input type="checkbox" data-i="${i}" ${done[i] ? 'checked' : ''}><span>${esc(t)}</span></label></li>`).join('')}</ul>
    </section>

    <aside class="card side" aria-label="Hitung mundur wawancara">
      <span class="pill">Wawancara terdekat</span>
      <div class="dt">
        <div class="d" aria-hidden="true"><b>${start.getDate()}</b><small>${BULAN[start.getMonth()].slice(0,3).toUpperCase()}</small></div>
        <div><b>${HARI[start.getDay()]}, ${dot(start)} WIB</b><span>Video call · ${iv.dur} menit</span></div>
      </div>
      <div class="count" role="timer" aria-label="Waktu menuju wawancara">
        <div><b id="c-d">0</b><small>hari</small></div><div><b id="c-h">0</b><small>jam</small></div><div><b id="c-m">0</b><small>menit</small></div>
      </div>
      <a class="cta" id="join" href="${esc(iv.link)}" target="_blank" rel="noopener noreferrer">Gabung wawancara →</a>
      <p class="hint">Dibuka di tab baru lewat ${esc(iv.platform)}.</p>
      <a class="ghost" href="beranda.html">← Kembali ke Beranda</a>
    </aside>
  </div>`;

  /* Checklist */
  const upd = () => { $('chk-n').textContent = done.filter(Boolean).length + ' dari ' + CHK.length + ' selesai'; };
  upd();
  document.querySelectorAll('.chk input').forEach(cb => cb.addEventListener('change', () => {
    done[+cb.dataset.i] = cb.checked; upd();
    try { localStorage.setItem(CHK_KEY, JSON.stringify(done)); } catch {}
  }));

  /* Hitung mundur */
  function tick() {
    const now = Date.now(), diff = start - now;
    const st = $('status');
    if (now > end) { st.textContent = 'Selesai'; st.className = 'pill'; }
    else if (now >= start) { st.textContent = '● Sedang berlangsung'; st.className = 'pill live'; }
    const m = Math.max(0, Math.floor(diff / 60000));
    $('c-d').textContent = Math.floor(m / 1440);
    $('c-h').textContent = Math.floor((m % 1440) / 60);
    $('c-m').textContent = m % 60;
  }
  tick(); setInterval(tick, 30000);

  /* Salin link */
  const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); };
  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(iv.link); toast('Link wawancara disalin.'); }
    catch {
      const r = document.createRange(); r.selectNodeContents($('link-txt'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      toast('Tekan Ctrl+C untuk menyalin link.');
    }
  });
})();
</script>
